# Application services for HRMS deployment.
# Connects to shared infrastructure (MariaDB + Redis) via external network.
# Infrastructure must be started separately using docker-compose.infra.yml.

x-common-env: &common-env
  DB_HOST: mariadb
  DB_PORT: "3306"
  REDIS_CACHE: redis-cache:6379
  REDIS_QUEUE: redis-queue:6379
  REDIS_SOCKETIO: redis-socketio:6379

services:
  # --- Frappe/HRMS Application ---
  configurator:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_SOCKETIO";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        echo "Configurator complete.";
    environment:
      <<: *common-env
      SOCKETIO_PORT: "9000"
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - app
      - infra

  create-site:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 mariadb:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        wait-for-it -t 120 redis-socketio:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for configurator...";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "Timeout waiting for configurator";
            exit 1;
          fi;
        done;
        echo "Configuration found";
        if [[ -f "sites/${SITE_NAME}/site_config.json" ]]; then
          echo "Site config found, attempting migration...";
          if bench --site ${SITE_NAME} migrate --skip-failing; then
            echo "Migration successful.";
          else
            echo "Migration failed, cleaning up stale database...";
            STALE_DB=$$(python3 -c "import json;print(json.load(open('sites/${SITE_NAME}/site_config.json')).get('db_name',''))" 2>/dev/null || echo "");
            if [ -n "$${STALE_DB}" ]; then
              echo "Dropping database and user '$${STALE_DB}'...";
              mysql -h mariadb -u root -p"${DB_ROOT_PASSWORD}" -e "DROP DATABASE IF EXISTS $${STALE_DB}; DROP USER IF EXISTS '$${STALE_DB}'@'%'; FLUSH PRIVILEGES;" 2>/dev/null || true;
            fi;
            rm -rf "sites/${SITE_NAME}";
          fi;
        fi;
        if [[ ! -f "sites/${SITE_NAME}/site_config.json" ]]; then
          echo "Creating site ${SITE_NAME}...";
          bench new-site ${SITE_NAME} \
            --force \
            --mariadb-root-password ${DB_ROOT_PASSWORD} \
            --admin-password ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required} \
            --no-mariadb-socket \
            --install-app erpnext \
            --install-app hrms;
        fi;
        echo "=== DB user diagnostics and fix ===";
        python3 -c "
        import json, sys
        try:
            import MySQLdb
        except ImportError:
            print('ERROR: MySQLdb not available'); sys.exit(1)
        cfg = json.load(open('sites/' + sys.argv[1] + '/site_config.json'))
        db, pw = cfg['db_name'], cfg['db_password']
        root_pw = sys.argv[2]
        print(f'DB name/user: {db}')
        print(f'DB password length: {len(pw)}')
        conn = MySQLdb.connect(host='mariadb', user='root', passwd=root_pw)
        cur = conn.cursor()
        cur.execute('SELECT user, host, plugin FROM mysql.user WHERE user=%s', (db,))
        rows = cur.fetchall()
        print(f'mysql.user entries: {rows}')
        cur.execute('SHOW GRANTS FOR %s@%s', (db, '%'))
        grants = cur.fetchall()
        print(f'Grants: {grants}')
        print('Testing site user connection...')
        try:
            test = MySQLdb.connect(host='mariadb', user=db, passwd=pw)
            test.close()
            print('Site user connection: OK')
        except Exception as e:
            print(f'Site user connection FAILED: {e}')
            print('Resetting password via root...')
            cur.execute('ALTER USER %s@%s IDENTIFIED BY %s', (db, '%', pw))
            cur.execute('FLUSH PRIVILEGES')
            conn.commit()
            try:
                test2 = MySQLdb.connect(host='mariadb', user=db, passwd=pw)
                test2.close()
                print('Site user connection after reset: OK')
            except Exception as e2:
                print(f'Site user connection after reset: STILL FAILED: {e2}')
        conn.close()
        " "${SITE_NAME}" "${DB_ROOT_PASSWORD}" 2>&1 || echo "DB diagnostics script failed";
        echo "=== End DB diagnostics ===";
        bench --site ${SITE_NAME} set-config host_name "https://${TRAEFIK_DOMAIN}";
        bench --site ${SITE_NAME} enable-scheduler;
        echo "${SITE_NAME}" > sites/currentsite.txt;
        echo "Site setup complete.";
    environment:
      <<: *common-env
      SITE_NAME: ${SITE_NAME:-hrms.localhost}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN:-hrms.localhost}
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - app
      - infra

  backend:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    entrypoint: ["bash", "-c"]
    command: ["bench serve --port 8000"]
    environment:
      <<: *common-env
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    networks:
      - app
      - infra

  websocket:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    entrypoint: ["bash", "-c"]
    command: ["node /home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      <<: *common-env
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    networks:
      - app
      - infra

  worker-short:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    entrypoint: ["bash", "-c"]
    command: ["bench worker --queue short"]
    environment:
      <<: *common-env
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    networks:
      - app
      - infra

  worker-long:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    entrypoint: ["bash", "-c"]
    command: ["bench worker --queue long"]
    environment:
      <<: *common-env
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    networks:
      - app
      - infra

  scheduler:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    entrypoint: ["bash", "-c"]
    command: ["bench schedule"]
    environment:
      <<: *common-env
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    networks:
      - app
      - infra

  # --- Reverse Proxy (uses same custom image as backend, with nginx-entrypoint) ---
  nginx:
    image: ${FRAPPE_IMAGE:-frappe/bench}:${FRAPPE_IMAGE_TAG:-latest}
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-hrms.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-hrms}.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-hrms}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-hrms}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-hrms}.loadbalancer.server.port=8080"
    restart: unless-stopped
    networks:
      - app
      - traefik
    depends_on:
      - backend
      - websocket

volumes:
  sites-data:
  logs:

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-hrms}_network
  infra:
    external: true
    name: ${INFRA_NETWORK:?INFRA_NETWORK is required}
  traefik:
    external: true
    name: traefik_network
