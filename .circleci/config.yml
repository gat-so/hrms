version: 2.1

executors:
  deployer:
    docker:
      - image: cimg/base:2024.01
    resource_class: medium

commands:
  setup-ssh:
    description: Configure SSH access to VPS
    steps:
      - add_ssh_keys:
          fingerprints:
            - "${SSH_KEY_FINGERPRINT}"
      - run:
          name: Add VPS to known hosts
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan -H ${VPS_HOST} >> ~/.ssh/known_hosts

jobs:
  lint-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install ruff
      - run:
          name: Lint check
          command: ruff check .
      - run:
          name: Format check
          command: ruff format --check .

  build-image:
    executor: deployer
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            IMAGE_REPO="ghcr.io/$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')/${CIRCLE_PROJECT_REPONAME}"
            SANITIZED_BRANCH=$(echo "${CIRCLE_BRANCH}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            git clone --depth 1 https://github.com/frappe/frappe_docker.git /tmp/frappe_docker

            # Inject GitHub token into private repo URLs in apps.json
            sed "s|https://github.com/gat-so/|https://${GITHUB_TOKEN}@github.com/gat-so/|g" \
              .github/helper/apps.json > /tmp/apps.json
            APPS_JSON_BASE64=$(cat /tmp/apps.json | base64 -w 0)

            docker build \
              --build-arg "FRAPPE_BRANCH=${FRAPPE_BRANCH:-develop}" \
              --build-arg "APPS_JSON_BASE64=${APPS_JSON_BASE64}" \
              -t ${IMAGE_REPO}:${CIRCLE_SHA1:0:7} \
              -t ${IMAGE_REPO}:${SANITIZED_BRANCH} \
              -f /tmp/frappe_docker/images/layered/Containerfile \
              /tmp/frappe_docker
      - run:
          name: Push Docker image
          command: |
            IMAGE_REPO="ghcr.io/$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')/${CIRCLE_PROJECT_REPONAME}"
            SANITIZED_BRANCH=$(echo "${CIRCLE_BRANCH}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker push ${IMAGE_REPO}:${CIRCLE_SHA1:0:7}
            docker push ${IMAGE_REPO}:${SANITIZED_BRANCH}

  deploy-dev:
    executor: deployer
    steps:
      - checkout
      - setup-ssh
      - run:
          name: Deploy to dev environment
          command: |
            GITHUB_ORG=$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')
            REPO_URL="https://${GITHUB_TOKEN}@github.com/${GITHUB_ORG}/${CIRCLE_PROJECT_REPONAME}.git"
            scp deploy/scripts/deploy-env.sh ${VPS_USER}@${VPS_HOST}:/tmp/deploy-env.sh
            ssh ${VPS_USER}@${VPS_HOST} "chmod +x /tmp/deploy-env.sh && /tmp/deploy-env.sh dev '${REPO_URL}' '${CIRCLE_BRANCH}' && rm /tmp/deploy-env.sh"

  deploy-prod:
    executor: deployer
    steps:
      - checkout
      - setup-ssh
      - run:
          name: Deploy to prod environment
          command: |
            GITHUB_ORG=$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')
            REPO_URL="https://${GITHUB_TOKEN}@github.com/${GITHUB_ORG}/${CIRCLE_PROJECT_REPONAME}.git"
            scp deploy/scripts/deploy-env.sh ${VPS_USER}@${VPS_HOST}:/tmp/deploy-env.sh
            ssh ${VPS_USER}@${VPS_HOST} "chmod +x /tmp/deploy-env.sh && /tmp/deploy-env.sh prod '${REPO_URL}' '${CIRCLE_BRANCH}' && rm /tmp/deploy-env.sh"

  deploy-pr-preview:
    executor: deployer
    steps:
      - checkout
      - setup-ssh
      - run:
          name: Deploy PR preview
          command: |
            PR_NUM=$(echo ${CIRCLE_PULL_REQUEST} | grep -oP '\d+$' || echo "0")
            if [ "${PR_NUM}" = "0" ]; then
              echo "No PR number found, skipping preview deployment."
              exit 0
            fi
            IMAGE_REPO="ghcr.io/$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')/${CIRCLE_PROJECT_REPONAME}"
            GITHUB_ORG=$(echo "${CIRCLE_PROJECT_USERNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')
            REPO_URL="https://${GITHUB_TOKEN}@github.com/${GITHUB_ORG}/${CIRCLE_PROJECT_REPONAME}.git"
            scp deploy/scripts/deploy-preview.sh ${VPS_USER}@${VPS_HOST}:/tmp/deploy-preview.sh
            ssh ${VPS_USER}@${VPS_HOST} "chmod +x /tmp/deploy-preview.sh && /tmp/deploy-preview.sh '${PR_NUM}' '${REPO_URL}' '${CIRCLE_BRANCH}' '${PREVIEW_DOMAIN}' '${IMAGE_REPO}' '${CIRCLE_SHA1:0:7}' && rm /tmp/deploy-preview.sh"

            PREVIEW_URL="https://hrms-${PR_NUM}.${PREVIEW_DOMAIN:-preview.example.com}"
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_ORG}/${CIRCLE_PROJECT_REPONAME}/issues/${PR_NUM}/comments" \
              -d "{\"body\":\"**Preview deployment ready!**\n\n${PREVIEW_URL}\n\n_This preview will be automatically cleaned up when the PR is closed or merged._\"}"

  cleanup-pr-preview:
    executor: deployer
    parameters:
      pr-number:
        type: string
    steps:
      - checkout
      - setup-ssh
      - run:
          name: Cleanup PR preview
          command: |
            scp deploy/scripts/cleanup-preview.sh ${VPS_USER}@${VPS_HOST}:/tmp/cleanup-preview.sh
            ssh ${VPS_USER}@${VPS_HOST} "chmod +x /tmp/cleanup-preview.sh && /tmp/cleanup-preview.sh '<< parameters.pr-number >>' && rm /tmp/cleanup-preview.sh"

workflows:
  # Run on every PR branch
  pr-checks:
    jobs:
      - lint-and-test:
          filters:
            branches:
              ignore:
                - prod
                - dev

      - build-image:
          requires:
            - lint-and-test
          filters:
            branches:
              ignore:
                - prod
                - dev

      - deploy-pr-preview:
          requires:
            - build-image
          filters:
            branches:
              ignore:
                - prod
                - dev

  # Deploy to dev when merged into dev branch
  deploy-dev-workflow:
    jobs:
      - build-image:
          filters:
            branches:
              only: dev

      - deploy-dev:
          requires:
            - build-image
          filters:
            branches:
              only: dev

  # Deploy to prod when merged into prod branch
  deploy-prod-workflow:
    jobs:
      - build-image:
          filters:
            branches:
              only: prod

      - deploy-prod:
          requires:
            - build-image
          filters:
            branches:
              only: prod
